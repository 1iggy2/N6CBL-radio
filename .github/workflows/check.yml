name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast, dependency-free checks; these report in seconds.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Page chrome matches content/nav.json
        run: node scripts/build-chrome.js --check

      - name: Blog output is current
        run: |
          node scripts/build-blog.js
          if ! git diff --quiet -- blog/index.html index.html; then
            echo "Blog HTML is stale. Run: node scripts/build-blog.js"
            git --no-pager diff --stat -- blog/index.html index.html
            exit 1
          fi

  # Viewport overflow sweep. Needs a browser, so it runs as its own job rather
  # than slowing the fast checks. Playwright is installed ad hoc — the repo
  # itself stays dependency-free with no package.json or lockfile.
  widths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: No horizontal overflow on any page
        run: node scripts/check-widths.js
