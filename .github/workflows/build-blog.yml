name: Build blog

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'
      - 'scripts/build-blog.js'
      - 'blog/index.html'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate blog HTML
        run: node scripts/build-blog.js

      - name: Commit generated blog output
        run: |
          if git diff --quiet -- blog/index.html index.html; then
            echo "Blog output is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html index.html
          git commit -m "Build blog index"

          # The QRZ refresh cron pushes to main every 15 minutes, so a bare push
          # here loses the race and the generated post never ships. Rebase and
          # retry, the same way the deploy workflow already does.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

          echo "Unable to push generated blog output after rebasing onto origin/main."
          exit 1
